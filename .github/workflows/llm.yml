# Corre el programa con el LLM por la API, usando el secreto DEEPSEEK_API_KEY del repo (Actions).
# Se dispara a mano desde Actions. Los resultados quedan como archivo de la corrida y, completos, en
# el registro (líneas "RESULTADO <archivo> <json>"), porque el archivo de la corrida no siempre se
# puede bajar.
name: llm
on:
  workflow_dispatch:
    inputs:
      particion:
        description: "Qué productos leer: escala_dev o escala_test (test se corre una sola vez)"
        default: "escala_dev"
      tarea:
        description: "serendipia (todo el programa) o dolor_de_la_propuesta (mide el dolor de las propuestas guardadas)"
        default: "serendipia"
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make test
      - name: Dolor de las propuestas guardadas
        if: inputs.tarea == 'dolor_de_la_propuesta'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m harness.dolor_de_la_propuesta data/evaluacion/versiones_escala_dev/eval-personas-libres_*.json
      - name: Personas, segmentos y propuestas con la API, y embudo
        if: inputs.tarea != 'dolor_de_la_propuesta'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: make serendipia-api PARTICION=${{ inputs.particion }}
      - name: Juntar resultados
        if: always()
        run: |
          mkdir -p resultados
          cp data/serendipia/*_${{ inputs.particion }}_api.json resultados/ 2>/dev/null || true
      - name: Copiar los resultados completos al registro
        if: always()
        run: |
          for f in resultados/*.json; do
            if [ -f "$f" ]; then
              echo "RESULTADO $(basename "$f") $(python -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), ensure_ascii=False))' "$f")"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-${{ inputs.particion }}
          path: resultados/
