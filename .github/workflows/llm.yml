# Corre el LLM con la API usando el secreto DEEPSEEK_API_KEY del repo (Actions). Se dispara a mano
# desde Actions. Los resultados quedan como archivo de la corrida y, completos, en el registro
# (líneas "RESULTADO <archivo> <json>"), porque el archivo de la corrida no siempre se puede bajar.
name: llm
on:
  workflow_dispatch:
    inputs:
      tarea:
        description: "serendipia (dos pasos + embudo), explorar (prueba las 25 variantes del prompt del paso B), optimizar (mejora la mejor variante) o prompts (explorar y después optimizar)"
        default: "serendipia"
      particion:
        description: "Qué productos leer: dev o test (los 21 primeros), escala_dev o escala_test (los 96 anclas)"
        default: "test"
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make test
      - name: Paso del LLM con la API y embudo
        if: inputs.tarea == 'serendipia'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: make serendipia-api PARTICION=${{ inputs.particion }}
      - name: Explorar el espacio de prompts del paso B
        if: inputs.tarea == 'explorar' || inputs.tarea == 'prompts'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m harness.explorar_prompts ${{ inputs.particion }}
      - name: Optimizar la mejor variante (parte de espacio_<particion>.json)
        if: inputs.tarea == 'optimizar' || inputs.tarea == 'prompts'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m harness.optimizar_prompt ${{ inputs.particion }}
      - name: Juntar resultados
        if: always()
        run: |
          mkdir -p resultados
          cp data/serendipia/*_${{ inputs.particion }}_api.json data/serendipia/espacio_${{ inputs.particion }}.json data/serendipia/optimizacion_${{ inputs.particion }}.json resultados/ 2>/dev/null || true
      - name: Copiar los resultados completos al registro
        if: always()
        run: |
          for f in resultados/*.json; do
            if [ -f "$f" ]; then
              echo "RESULTADO $(basename "$f") $(python -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), ensure_ascii=False))' "$f")"
            fi
          done
      # Los resultados quedan como archivo de la corrida (pestaña Actions, o `gh run download <id>`).
      # Antes se empujaban a una rama, pero GitHub rechaza ese push cuando cambia el workflow.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-${{ inputs.tarea }}-${{ inputs.particion }}
          path: resultados/
