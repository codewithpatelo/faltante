# Corre el paso del LLM con la API sobre test usando el secreto DEEPSEEK_API_KEY del repo (Actions),
# y guarda los resultados en la rama `resultados-llm`. Se dispara a mano desde Actions.
name: llm
on:
  workflow_dispatch:
    inputs:
      particion:
        description: "Qué productos leer: test (los 10 primeros) o escala"
        default: "test"
permissions:
  contents: write
jobs:
  correr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make test
      - name: Paso del LLM con la API sobre test y embudo
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: make serendipia-api PARTICION=${{ inputs.particion }}
      - name: Guardar resultados en la rama resultados-llm
        run: |
          mkdir -p resultados && cp data/serendipia/divergente_${{ inputs.particion }}_api.json data/serendipia/embudo_${{ inputs.particion }}_api.json resultados/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout -B resultados-llm
          git add -f resultados && git commit -m "Resultados LLM ${GITHUB_SHA::7}" && git push -f origin resultados-llm
