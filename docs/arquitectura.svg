<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 450" role="img" aria-label="Arquitectura del harness: una política intercambiable llama a cuatro operaciones del motor; el motor aplica guardrails, presupuesto y caché, ejecuta skills que resuelven en adaptadores de datos, y escribe la traza y el expediente." font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="12" fill="currentColor">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="fla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#0f5f6e)"/>
    </marker>
  </defs>

  <!-- Pistas -->
  <rect x="10" y="150" width="130" height="90" rx="4" style="fill:var(--surface,#fff)" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="75" y="185" text-anchor="middle" font-weight="600" font-size="13">Pistas</text>
  <text x="75" y="205" text-anchor="middle" fill-opacity="0.65">votos con</text>
  <text x="75" y="221" text-anchor="middle" fill-opacity="0.65">los pies</text>

  <!-- Política -->
  <rect x="180" y="80" width="170" height="230" rx="4" style="fill:var(--surface,#fff)" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="265" y="105" text-anchor="middle" font-weight="600" font-size="13">Política</text>
  <text x="265" y="122" text-anchor="middle" fill-opacity="0.65" font-size="11">decide qué hacer</text>
  <rect x="195" y="140" width="140" height="38" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="265" y="164" text-anchor="middle">fija</text>
  <rect x="195" y="190" width="140" height="38" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="265" y="214" text-anchor="middle">heurística</text>
  <rect x="195" y="240" width="140" height="38" rx="3" fill="none" style="stroke:var(--accent,#0f5f6e)" stroke-width="1.6"/>
  <text x="265" y="264" text-anchor="middle" style="fill:var(--accent,#0f5f6e)" font-weight="600">ReAct (LLM)</text>
  <text x="265" y="298" text-anchor="middle" fill-opacity="0.55" font-size="10.5">intercambiables</text>

  <!-- Motor -->
  <rect x="440" y="50" width="200" height="300" rx="4" style="fill:var(--surface,#fff)" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.4"/>
  <text x="540" y="75" text-anchor="middle" font-weight="600" font-size="13">Motor</text>
  <text x="458" y="102">proponer()</text>
  <text x="458" y="122">ejecutar()</text>
  <text x="458" y="142">veredicto()</text>
  <text x="458" y="162">leer_skill()</text>
  <line x1="455" y1="178" x2="625" y2="178" stroke="currentColor" stroke-opacity="0.25"/>
  <rect x="455" y="192" width="82" height="34" rx="3" fill="none" style="stroke:var(--accent,#0f5f6e)" stroke-width="1.6"/>
  <text x="496" y="213" text-anchor="middle" font-size="11" style="fill:var(--accent,#0f5f6e)" font-weight="600">guardrails</text>
  <rect x="543" y="192" width="82" height="34" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="584" y="213" text-anchor="middle" font-size="11">presupuesto</text>
  <rect x="455" y="234" width="82" height="34" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="496" y="255" text-anchor="middle" font-size="11">caché</text>
  <rect x="543" y="234" width="82" height="34" rx="3" fill="none" stroke="currentColor" stroke-opacity="0.35"/>
  <text x="584" y="255" text-anchor="middle" font-size="11">traza</text>
  <text x="540" y="296" text-anchor="middle" fill-opacity="0.65" font-size="11">estado: hipótesis,</text>
  <text x="540" y="312" text-anchor="middle" fill-opacity="0.65" font-size="11">evidencias, veredictos</text>

  <!-- Skills -->
  <rect x="700" y="50" width="180" height="160" rx="4" style="fill:var(--surface,#fff)" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="790" y="75" text-anchor="middle" font-weight="600" font-size="13">Skills</text>
  <text x="790" y="91" text-anchor="middle" fill-opacity="0.55" font-size="10.5">un SKILL.md cada una</text>
  <text x="716" y="116">contar_oferta</text>
  <text x="716" y="135">ratio_precio</text>
  <text x="716" y="154">persistencia</text>
  <text x="716" y="173">voto_manos</text>
  <text x="716" y="192">viabilidad</text>

  <!-- Adaptadores -->
  <rect x="700" y="250" width="180" height="100" rx="4" style="fill:var(--surface,#fff)" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="790" y="275" text-anchor="middle" font-weight="600" font-size="13">Adaptadores</text>
  <text x="716" y="300">fixtures</text>
  <text x="716" y="319">mercadolibre_api</text>
  <text x="716" y="338" fill-opacity="0.55">… otras fuentes</text>

  <!-- Salidas -->
  <rect x="440" y="392" width="200" height="44" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="4 3"/>
  <text x="540" y="412" text-anchor="middle" font-size="11.5">out/ traza · estado · resumen</text>
  <text x="540" y="428" text-anchor="middle" fill-opacity="0.6" font-size="11">→ reporte.html</text>

  <!-- Flechas -->
  <line x1="140" y1="195" x2="178" y2="195" stroke="currentColor" marker-end="url(#fl)"/>
  <text x="159" y="186" text-anchor="middle" font-size="11" fill-opacity="0.7">lee</text>

  <line x1="350" y1="125" x2="438" y2="125" stroke="currentColor" marker-end="url(#fl)"/>
  <text x="394" y="116" text-anchor="middle" font-size="11" fill-opacity="0.7">llama</text>

  <line x1="440" y1="255" x2="352" y2="255" style="stroke:var(--accent,#0f5f6e)" stroke-dasharray="5 3" marker-end="url(#fla)"/>
  <text x="396" y="246" text-anchor="middle" font-size="11" style="fill:var(--accent,#0f5f6e)">observación</text>
  <text x="396" y="272" text-anchor="middle" font-size="11" style="fill:var(--accent,#0f5f6e)">o RECHAZO</text>

  <line x1="640" y1="122" x2="698" y2="122" stroke="currentColor" marker-end="url(#fl)"/>
  <text x="669" y="113" text-anchor="middle" font-size="11" fill-opacity="0.7">ejecuta</text>

  <line x1="700" y1="162" x2="642" y2="162" stroke="currentColor" stroke-opacity="0.6" marker-end="url(#fl)"/>
  <text x="669" y="178" text-anchor="middle" font-size="11" fill-opacity="0.7">texto</text>

  <line x1="790" y1="210" x2="790" y2="248" stroke="currentColor" marker-end="url(#fl)"/>
  <text x="798" y="234" font-size="11" fill-opacity="0.7">contrato común</text>

  <line x1="540" y1="350" x2="540" y2="390" stroke="currentColor" marker-end="url(#fl)"/>
  <text x="548" y="374" font-size="11" fill-opacity="0.7">escribe</text>
</svg>
