<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 724" role="img" aria-label="Flujo del harness: las pistas entran al agente, que decide qué producto hay detrás, qué verificar y cuándo dar veredicto. El agente le pide operaciones al motor del harness, que ejecuta, aplica las reglas y devuelve el dato o un rechazo. El motor corre skills, que piden datos a adaptadores de fuentes, y escribe el expediente." font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="currentColor">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="fla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent,#0f5f6e)"/>
    </marker>
  </defs>

  <!-- 1. Pistas -->
  <rect x="20" y="16" width="440" height="78" rx="4" style="fill:var(--surface,#fff)" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="38" y="42" font-weight="600" font-size="15">Pistas</text>
  <text x="38" y="63">Señales de comportamiento que sugieren demanda insatisfecha</text>
  <text x="38" y="82" font-style="italic" fill-opacity="0.6">ej.: «nut milk maker» en el top 50 de hogar de un courier</text>

  <line x1="240" y1="94" x2="240" y2="128" stroke="currentColor" marker-end="url(#fl)"/>
  <text x="252" y="116" font-size="11.5" fill-opacity="0.7">una pista por vez</text>

  <!-- 2. Agente -->
  <rect x="20" y="130" width="440" height="128" rx="4" style="fill:var(--surface,#fff);stroke:var(--accent,#0f5f6e)" stroke-width="2"/>
  <text x="38" y="157" font-weight="600" font-size="15">Agente (LLM)</text>
  <text x="442" y="157" text-anchor="end" font-weight="600" font-size="12" style="fill:var(--accent,#0f5f6e)">DECIDE</text>
  <text x="38" y="182">1. Qué producto hay detrás de la pista y qué tipo de oportunidad es</text>
  <text x="38" y="202">2. Qué verificación correr ahora, y si vale la pena seguir</text>
  <text x="38" y="222">3. Cuándo alcanza la evidencia y qué veredicto dar</text>
  <text x="38" y="245" font-size="11.5" fill-opacity="0.6">Ve las skills por nombre; lee su instructivo cuando lo necesita</text>

  <!-- Baselines -->
  <rect x="520" y="146" width="220" height="96" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="5 4"/>
  <text x="536" y="168" font-size="11.5" fill-opacity="0.65">En el mismo lugar, para comparar:</text>
  <text x="536" y="190" font-weight="600">Baselines sin LLM</text>
  <text x="536" y="210" font-size="12">fija: corre todo sobre todo</text>
  <text x="536" y="228" font-size="12">heurística: reglas a mano</text>
  <line x1="518" y1="194" x2="462" y2="194" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="5 4"/>

  <!-- Agente <-> Motor -->
  <line x1="90" y1="258" x2="90" y2="358" stroke="currentColor" marker-end="url(#fl)"/>
  <text x="102" y="284" font-size="11.5" font-weight="600">pide una operación</text>
  <text x="102" y="300" font-size="11.5" fill-opacity="0.65">proponer hipótesis · verificar · dar veredicto · leer skill</text>
  <line x1="420" y1="358" x2="420" y2="258" style="stroke:var(--accent,#0f5f6e)" marker-end="url(#fla)"/>
  <text x="408" y="328" text-anchor="end" font-size="11.5" font-weight="600" style="fill:var(--accent,#0f5f6e)">devuelve el dato</text>
  <text x="408" y="344" text-anchor="end" font-size="11.5" style="fill:var(--accent,#0f5f6e)">o un rechazo si violó una regla</text>

  <!-- 3. Motor -->
  <rect x="20" y="360" width="440" height="112" rx="4" style="fill:var(--surface,#fff)" stroke="currentColor" stroke-opacity="0.75" stroke-width="1.4"/>
  <text x="38" y="387" font-weight="600" font-size="15">Motor del harness</text>
  <text x="442" y="387" text-anchor="end" font-size="12" fill-opacity="0.65">ejecuta y controla, no decide</text>
  <text x="38" y="412">Registra hipótesis y evidencias (H1, E1, E2…)</text>
  <text x="38" y="432">Aplica las reglas: <tspan font-weight="600" style="fill:var(--accent,#0f5f6e)">sin evidencia no hay veredicto</tspan></text>
  <text x="38" y="452">Cachea respuestas y deja traza de cada paso</text>

  <!-- Expediente -->
  <rect x="520" y="376" width="220" height="80" rx="4" fill="none" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="536" y="400" font-weight="600">Expediente</text>
  <text x="536" y="420" font-size="12">por pista: hipótesis, datos</text>
  <text x="536" y="437" font-size="12">y veredicto con su porqué</text>
  <line x1="460" y1="416" x2="518" y2="416" stroke="currentColor" marker-end="url(#fl)"/>
  <text x="489" y="408" text-anchor="middle" font-size="11" fill-opacity="0.7">escribe</text>

  <line x1="240" y1="472" x2="240" y2="508" stroke="currentColor" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="252" y="494" font-size="11.5" fill-opacity="0.7">corre la skill pedida · vuelve el resultado</text>

  <!-- 4. Skills -->
  <rect x="20" y="510" width="440" height="86" rx="4" style="fill:var(--surface,#fff)" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="38" y="536" font-weight="600" font-size="15">Skills</text>
  <text x="442" y="536" text-anchor="end" font-size="12" fill-opacity="0.65">una pregunta cada una</text>
  <text x="38" y="559">¿Ya se vende acá? · ¿Pagan más que afuera? · ¿Es tendencia o pico?</text>
  <text x="38" y="579">¿Alguien lo dice? · ¿Se puede importar?</text>

  <line x1="240" y1="596" x2="240" y2="632" stroke="currentColor" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="252" y="618" font-size="11.5" fill-opacity="0.7">pide el dato · vuelve el número</text>

  <!-- 5. Adaptadores -->
  <rect x="20" y="634" width="440" height="74" rx="4" style="fill:var(--surface,#fff)" stroke="currentColor" stroke-opacity="0.45"/>
  <text x="38" y="660" font-weight="600" font-size="15">Adaptadores</text>
  <text x="442" y="660" text-anchor="end" font-size="12" fill-opacity="0.65">traen el dato de una fuente</text>
  <text x="38" y="684">API de Mercado Libre (requiere token) · datos sintéticos · …</text>
</svg>
